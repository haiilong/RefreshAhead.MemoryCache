name: RefreshAhead.MemoryCache CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - run: dotnet --info

      - run: dotnet restore RefreshAhead.MemoryCache.slnx

      - run: dotnet build RefreshAhead.MemoryCache.slnx -c Release --no-restore

      - run: dotnet test RefreshAhead.MemoryCache.slnx -c Release --no-build --logger "trx;LogFileName=test-results.trx"

      - run: dotnet pack src/RefreshAhead.MemoryCache/RefreshAhead.MemoryCache.csproj -c Release --no-build -o artifacts

      - run: dotnet pack src/RefreshAhead.MemoryCache.HealthChecks/RefreshAhead.MemoryCache.HealthChecks.csproj -c Release --no-build -o artifacts

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: refreshahead-memorycache-test-results
          path: "**/TestResults/*.trx"

      - uses: actions/upload-artifact@v6
        with:
          name: refreshahead-memorycache-packages
          path: artifacts/*
